<div class="card">

  <img class="main-img" [src]="mainImage">

  <div class="thumbs">
    <img *ngFor="let img of product.images"
         [src]="img"
         (click)="setImage(img)">
  </div>

  <h2>{{ product.name }}</h2>
  <p>{{ product.description }}</p>

  <div class="price">{{ product.price }} ₸</div>
  <div class="rating">⭐ {{ product.rating }}</div>

  <div class="buttons">
    <a [href]="product.link" target="_blank">Kaspi</a>
    <button (click)="shareWhatsApp()">WhatsApp</button>
    <button (click)="shareTelegram()">Telegram</button>
  </div>

</div>
