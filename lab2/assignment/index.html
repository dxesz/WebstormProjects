<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="main">
        <p class="text">Spotify <br></p>
        <p id="second"><strong>Sign up for free</strong></p>
        <p id="third">Create your account to start listening.</p>

        <form>
            <p><strong>Email address</strong></p>
            <input type="email" placeholder="name@example.com">
            <p id="fr">We'll never share your email with anyone.</p>

            <p><strong>Password</strong></p>
            <input type="password" placeholder="Create a password">
            <p id="fr">Use 8+ characters for better security.</p>

            <p><strong>Username</strong></p>
            <input type="username" placeholder="Pick a display name">
            <label for="box">
            <input type="checkbox" id="checkbox">
            I agree to the <b id="box">Terms and Conditions</b>
            </label>
        </form>

        <button class="sign">Sign Up</button>
        <p class="login">
            Already have an account?
            <a href="#">Log in</a>
        </p>
    </div>
</body>
</html>
